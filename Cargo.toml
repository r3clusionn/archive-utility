[package]
name = "archive-utility"
version = "0.1.0"
edition = "2021"
description = "A versioned archive format and tool: parallel compression, per-chunk checksums, streaming, random access and corruption recovery."
license = "MIT"

[lib]
name = "arx"

[[bin]]
name = "arx"
path = "src/main.rs"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lz4_flex = "0.11"
workpool = { git = "https://github.com/r3clusionn/thread-pool-library", rev = "8a03458" }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
debug = false
